dataset:
  task1:
    name: imdb
    num_classes: 2
    max_seq_len: 64
  task2:
    name: ag_news
    num_classes: 4
    max_seq_len: 64
  data_dir: ./data
  batch_size: 16
  val_split: 0.1
  sample_size: 1000

model:
  name: distilbert-base-uncased
  hidden_size: 768
  num_labels: 6
  dropout_rate: 0.1
  learning_rate: 2e-5
  weight_decay: 1e-4
  adam_epsilon: 1e-8

training:
  num_epochs: 2
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  seed: 42

experience_replay:
  buffer_size: 1000
  replay_ratio: 0.5
  sample_strategy: uniform

continual_methods:
  fine_tuning:
    enabled: true
  ewc:
    enabled: true
    lambda: 1000.0
    fisher_sample_size: 100
  lwf:
    enabled: true
    temperature: 2.0
    alpha: 0.5
  der:
    enabled: true
    buffer_size: 2000
    alpha: 0.5
    beta: 0.5

evaluation:
  num_runs: 3
  metrics:
    - accuracy
    - f1_macro
    - forgetting_rate
  save_results: true
  results_dir: ./results

logging:
  log_level: INFO
  log_file: ./results/training.log
  save_model: true
  model_dir: ./results/models

visualization:
  enabled: true
  plots_dir: ./results/plots
  figsize: [10, 6]
  dpi: 300