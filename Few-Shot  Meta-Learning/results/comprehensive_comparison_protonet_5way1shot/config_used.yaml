experiment:
  name: protonet_5way1shot
  seed: 42
  repeat_times: 1
  device: cuda
  num_workers: 0
  exp_id: comprehensive_comparison_protonet_5way1shot
data:
  dataset_name: omniglot
  data_path: ./data/raw
  processed_path: ./data/processed
  download: true
  image_size: 28
  train_ways: 5
  train_shots: 1
  train_queries: 15
  test_ways: 5
  test_shots: 1
  test_queries: 15
  augment: true
  augmentation_methods:
  - random_rotation
  - random_shift
model:
  type: protonet
  backbone: convnet
  hidden_size: 64
  num_layers: 4
  embedding_dim: 64
  dropout_rate: 0.0
training:
  method: meta
  meta_lr: 0.001
  fast_lr: 0.4
  epochs: 100
  meta_batch_size: 32
  inner_steps: 1
  optimizer: adam
  scheduler: cosine
  weight_decay: 0.0
  clip_grad_norm: 5.0
evaluation:
  metrics:
  - accuracy
  - confusion_matrix
  eval_freq: 5
  save_best: true
  early_stopping: false
  patience: 10
logging:
  level: INFO
  log_dir: ./logs
results:
  save_dir: ./results
  save_checkpoints: true
  save_plots: true
