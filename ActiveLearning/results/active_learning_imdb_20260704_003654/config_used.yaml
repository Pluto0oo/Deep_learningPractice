experiment:
  name: active_learning_imdb
  seed: 42
  repeat_times: 3
  exp_id: active_learning_imdb_20260704_003654
data:
  dataset: imdb
  path: data/processed
  max_features: 5000
  test_size: 0.2
  initial_label_ratio: 0.05
  use_simulated: false
active_learning:
  strategies:
  - random
  - entropy
  - margin
  - uncertainty
  - max_disagreement
  label_ratios:
  - 0.1
  - 0.3
  - 0.5
model:
  type: LogisticRegression
  params:
    max_iter: 1000
    C: 1.0
    penalty: l2
evaluation:
  metrics:
  - accuracy
  - f1
  - precision
  - recall
visualization:
  figsize:
  - 10
  - 6
  dpi: 300
  colors:
    random: '#4C72B0'
    entropy: '#DD8452'
    margin: '#55A868'
    uncertainty: '#C44E52'
  markers:
    random: o
    entropy: s
    margin: ^
    uncertainty: D
