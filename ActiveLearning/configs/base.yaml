experiment:
  name: base_experiment
  seed: 42
  repeat_times: 1

data:
  path: data/processed
  test_size: 0.2
  val_size: 0.1

model:
  type: SimpleMLP
  input_dim: 20
  hidden_dim: 128
  num_layers: 2
  output_dim: 10
  dropout_rate: 0.5

training:
  epochs: 100
  batch_size: 32
  loss: cross_entropy
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0
  scheduler: None
  save_best: true

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1