experiment:
  name: active_learning_baseline
  seed: 42
  repeat_times: 3

data:
  path: data/processed
  test_size: 0.2
  val_size: 0.15

model:
  type: SimpleMLP
  input_dim: 20
  hidden_dim: 256
  num_layers: 3
  output_dim: 5
  dropout_rate: 0.3

training:
  epochs: 150
  batch_size: 64
  loss: cross_entropy
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  scheduler: cosine
  save_best: true

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1